name: Build Windows

# Every push to main builds the MSI and keeps it as a run artifact for testing.
# A `v*` tag also attaches the MSI to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # release upload on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build MSI
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: PowerMeter-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # latest.json is what the app polls for updates (checkRelease.js reads
      # releases/latest/download/latest.json).
      - name: Update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          name=$(basename src-tauri/target/release/bundle/msi/*.msi)
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          python - "$GITHUB_REF_NAME" "$name" "$base" <<'PY'
          import json, os, re, sys, datetime
          tag, name, base = sys.argv[1:]
          version = tag[1:]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no '## {version}' section: add the release notes first")
          notes = [l[2:].strip() for l in m.group(1).splitlines() if l.startswith("- ")]
          if not notes:
              sys.exit(f"CHANGELOG.md section {version} has no '- ' bullet points")
          msi = f"src-tauri/target/release/bundle/msi/{name}"
          json.dump({
              "version": version,
              "msiUrl": f"{base}/download/{tag}/{name}",
              "releaseNotesUrl": f"{base}/tag/{tag}",
              "date": datetime.date.today().isoformat(),
              "sizeMb": round(os.path.getsize(msi) / 1048576, 1),
              "notes": notes,
          }, open("latest.json", "w", encoding="utf-8"), ensure_ascii=False)
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(f"- {n}" for n in notes) + "\n")
          PY
          cat latest.json

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            latest.json
