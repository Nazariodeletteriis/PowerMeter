name: Build Windows

# Every push to main builds the MSI and keeps it as a run artifact for testing.
# A `v*` tag also attaches the MSI to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # release upload on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build MSI
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: PowerMeter-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # latest.json is what the app polls for updates (checkRelease.js reads
      # releases/latest/download/latest.json).
      - name: Update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          name=$(basename src-tauri/target/release/bundle/msi/*.msi)
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          printf '{"version":"%s","msiUrl":"%s","releaseNotesUrl":"%s"}\n' \
            "${GITHUB_REF_NAME#v}" "$base/download/$GITHUB_REF_NAME/$name" "$base/tag/$GITHUB_REF_NAME" > latest.json
          cat latest.json

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            latest.json
